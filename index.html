<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOKMARKER</title>
  <link rel="stylesheet" href="./css/all.min.css">
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main class="text-center">
    <h1 class="title">Bookmarker</h1>
    <hr class="dotted-line">
    <h2><i class="fa-solid fa-bookmark mb-4"></i> Bookmark Your Favorite Sites <i class="fa-solid fa-bookmark"></i></h2>
  </main>

  <section>
    <div class="container">
      <div class="mb-2">
        <label for="siteName" class="form-label"><i class="fa-solid fa-book-bookmark"></i> Site Name</label>
        <input type="text" class="form-control" id="siteName" placeholder="Bookmark Name">
      </div>
      <div class="mb-2">
        <label for="siteURL" class="form-label"><i class="fa-solid fa-link"></i> Site URL</label>
        <input type="url" class="form-control" id="siteURL" placeholder="Website URL">
      </div>
      <div class="text-center m-4">
        <button onclick="addSite();" class="btn btn-outline-danger">Submit</button>
      </div>
    </div>
  </section>

  <hr class="dotted-line">

  <div class="container">
    <table class="table mt-4 text-center bg-light">
      <thead>
        <tr>
          <th>Index</th>
          <th>Website Name</th>
          <th>Visit</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="bodyTable"></tbody>
    </table>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
